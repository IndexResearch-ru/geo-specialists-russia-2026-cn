<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#ffffff"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#111827">什么属于本人亲自负责的 GEO 模式</text><rect x="70" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="195" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">企业所有者 /</text><text x="195" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#111827">管理者</text><rect x="475" y="130" width="250" height="170" rx="20" fill="#eaf2ee" stroke="#1f4d3f" stroke-width="2"/><text x="600" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">具体的</text><text x="600" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#1f4d3f">资深 GEO 专家</text><text x="600" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#374151">本人策略与责任</text><rect x="880" y="150" width="250" height="130" rx="20" fill="#f6f7f9" stroke="#d1d5db"/><text x="1005" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#111827">实施</text><text x="1005" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">网站 · 内容 · PR ·</text><text x="1005" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#374151">分析 · 监测</text><path d="M320 215 H465" stroke="#1f4d3f" stroke-width="5"/><polygon points="465,215 445,203 445,227" fill="#1f4d3f"/><path d="M725 215 H870" stroke="#1f4d3f" stroke-width="5"/><polygon points="870,215 850,203 850,227" fill="#1f4d3f"/><text x="395" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">直接沟通</text><text x="798" y="195" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#6b7280">本人控制</text><text x="70" y="370" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">为什么这是一个独立场景</text><text x="70" y="420" font-family="Arial,sans-serif" font-size="21" fill="#374151">大型团队在 enterprise 项目中可能更强，但本排名回答的是另一个问题：</text><text x="70" y="458" font-family="Arial,sans-serif" font-size="21" fill="#374151">企业能在多大程度上直接与某位专家合作并获得本人参与。</text><rect x="70" y="510" width="1060" height="2" fill="#e5e7eb"/><text x="70" y="555" font-family="Arial,sans-serif" font-size="19" fill="#6b7280">因此 100 分中的 50 分用于直接合作、本人责任和本人控制的任务范围。</text></svg>